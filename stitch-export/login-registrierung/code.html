        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            font-family: 'Manrope', sans-serif;

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Suppressed Shell as per Transactional Rule) -->
<header class="w-full flex justify-center py-8">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="restaurant_menu">restaurant_menu</span>
<h1 class="font-headline font-bold text-3xl tracking-tight text-primary">Rezeptretter</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 pb-12">
<!-- Authentication Container -->
<div class="w-full max-w-md bg-surface-container-low rounded-xl p-1 overflow-hidden">
<!-- Tabs -->
<div class="flex p-2 gap-2 bg-surface-container rounded-t-xl">
<button class="flex-1 py-3 text-center font-label font-bold text-primary bg-surface-container-lowest rounded-full transition-all duration-200">
                    Anmelden
                </button>
<button class="flex-1 py-3 text-center font-label font-medium text-on-surface-variant hover:text-primary transition-all duration-200">
                    Registrieren
                </button>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-b-xl rounded-t-lg">
<div class="mb-8 text-center">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-2">Willkommen zurück</h2>
<p class="text-on-surface-variant font-body">Melde dich an, um deine Rezepte zu verwalten.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container border-0 rounded-full px-6 text-on-surface placeholder:text-stone-400 focus:ring-2 focus:ring-primary/40 transition-all outline-none" id="email" placeholder="beispiel@mail.de" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-sm font-semibold text-on-surface-variant" for="password">Passwort</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Vergessen?</a>
</div>
<div class="relative">
<input class="w-full h-14 bg-surface-container border-0 rounded-full px-6 text-on-surface placeholder:text-stone-400 focus:ring-2 focus:ring-primary/40 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="hero-gradient w-full h-14 rounded-full text-white font-headline font-bold text-lg shadow-lg shadow-primary/10 active:scale-95 transition-transform duration-150 mt-4" type="submit">
                        Anmelden
                    </button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface-container-lowest text-on-surface-variant font-label">oder</span>
</div>
</div>
<!-- Secondary Actions -->
<div class="space-y-4">
<button class="w-full h-14 bg-surface-container-high hover:bg-surface-variant text-primary font-label font-bold rounded-full flex items-center justify-center gap-3 transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="magic_button">magic_button</span>
                        Magic Link per E-Mail senden
                    </button>
<button class="w-full h-14 bg-white border border-outline-variant/50 text-on-surface font-label font-bold rounded-full flex items-center justify-center gap-3 transition-all hover:bg-surface-container-low active:scale-95 duration-150">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google Login
                    </button>
</div>
</div>
</div>
</main>
<!-- Footer Decorative Image -->
<div class="fixed bottom-0 left-0 w-full h-1/4 opacity-10 pointer-events-none -z-10 overflow-hidden">

</div>
<!-- Decorative Elements (Editorial Feel) -->
<div class="absolute top-12 left-12 w-32 h-32 bg-secondary-fixed/20 rounded-full blur-3xl"></div>
<div class="absolute bottom-24 right-12 w-48 h-48 bg-primary-fixed/20 rounded-full blur-3xl"></div>
</body></html>
